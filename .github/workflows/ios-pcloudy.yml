name: iOS Appium - Firebase → pCloudy

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  ios-appium:

    name: Firebase IPA → pCloudy → Appium iOS

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Setup Python
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ==================================================
      # 3. Install dependencies
      # ==================================================

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install Appium-Python-Client selenium pytest pytest-html
          fi

          echo "=========================================="
          echo "Installed Python packages"
          echo "=========================================="

          pip list


      # ==================================================
      # 4. Firebase Authentication
      # ==================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}


      # ==================================================
      # 5. Get Firebase Access Token
      # ==================================================

      - name: Get Firebase access token
        id: firebase-token
        shell: bash
        run: |
          set -euo pipefail

          echo "Getting Firebase access token..."

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Firebase authentication successful"


      # ==================================================
      # 6. Get Latest Firebase iOS Release
      # ==================================================

      - name: Get latest Firebase iOS release
        id: firebase-release
        shell: bash
        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Getting latest Firebase iOS release"
          echo "=========================================="

          PROJECT_NUMBER="$(printf '%s' "$FIREBASE_PROJECT_NUMBER" | tr -d '[:space:]')"
          APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"

          printf '%s\n' "$RESPONSE" > firebase-release.json

          DOWNLOAD_URL="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"

          RELEASE_NAME="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Firebase iOS release not found"
            cat firebase-release.json
            exit 1
          fi

          echo "Latest Firebase release:"
          echo "$RELEASE_NAME"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 7. Download Existing IPA
      # ==================================================

      - name: Download latest Firebase IPA
        shell: bash
        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Downloading existing Firebase IPA"
          echo "=========================================="

          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            "$DOWNLOAD_URL" \
            --output firebase-ios-app.ipa

          if [ ! -s firebase-ios-app.ipa ]; then
            echo "ERROR: IPA download failed"
            exit 1
          fi

          echo "Firebase IPA downloaded successfully"

          ls -lh firebase-ios-app.ipa


      # ==================================================
      # 8. Verify IPA
      # ==================================================

      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verifying IPA"
          echo "=========================================="

          file firebase-ios-app.ipa

          IPA_SIZE=$(stat -c%s firebase-ios-app.ipa)

          if [ "$IPA_SIZE" -le 0 ]; then
            echo "ERROR: IPA is empty"
            exit 1
          fi

          echo "IPA size: ${IPA_SIZE} bytes"

          unzip -l firebase-ios-app.ipa | head -30

          echo "IPA verification successful"


      # ==================================================
      # 9. pCloudy Authentication
      # ==================================================

      - name: Authenticate with pCloudy
        id: pcloudy-auth
        shell: bash
        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Authenticating with pCloudy"
          echo "=========================================="

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          echo "$RESPONSE" > pcloudy-auth.json

          TOKEN="$(echo "$RESPONSE" | jq -r '.result.token // empty')"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: pCloudy authentication failed"
            cat pcloudy-auth.json
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

          echo "pCloudy authentication successful"


      # ==================================================
      # 10. Get Available iOS Devices
      # ==================================================

      - name: Check available pCloudy iOS devices
        id: pcloudy-devices
        shell: bash
        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking available pCloudy iOS devices"
          echo "=========================================="

          if [ -z "$PCLOUDY_TOKEN" ]; then
            echo "ERROR: pCloudy token is empty"
            exit 1
          fi

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"token\":\"${PCLOUDY_TOKEN}\",\"duration\":15,\"platform\":\"iOS\",\"available_now\":true}" \
              "https://device.pcloudy.com/api/devices"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "RAW pCloudy iOS device response"
          echo "=========================================="

          cat pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "Extracted device names"
          echo "=========================================="

          jq -r '
            .. |
            objects |
            .full_name? //
            empty
          ' pcloudy-devices.json 2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "Searching for iPhone 17"
          echo "=========================================="

          DEVICE_FOUND="$(
            jq -r '
              .. |
              objects |
              .full_name? //
              empty
            ' pcloudy-devices.json 2>/dev/null |
            grep -i "iPhone17" |
            head -1 || true
          )"

          if [ -z "$DEVICE_FOUND" ]; then

            echo "WARNING: iPhone 17 was not found through API."

            echo ""
            echo "The API response above is the source of truth."
            echo "Do NOT start Appium with a guessed DeviceFullName."

            exit 1

          fi

          echo "iPhone 17 found:"
          echo "$DEVICE_FOUND"

          echo "device=$DEVICE_FOUND" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 11. Upload IPA to pCloudy
      # ==================================================

      - name: Upload IPA to pCloudy
        id: pcloudy-upload
        shell: bash
        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Uploading Firebase IPA to pCloudy"
          echo "=========================================="

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              -o pcloudy-upload.json \
              -w "%{http_code}" \
              --request POST \
              -F "file=@firebase-ios-app.ipa" \
              -F "source_type=raw" \
              -F "token=${PCLOUDY_TOKEN}" \
              -F "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"

          echo "pCloudy upload HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: pCloudy IPA upload failed"
            cat pcloudy-upload.json
            exit 1
          fi

          echo "IPA uploaded to pCloudy successfully"


      # ==================================================
      # 12. Run iOS Appium Test
      # ==================================================

      - name: Run iOS Appium lifecycle test
        shell: bash
        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          PCLOUDY_DEVICE: ${{ steps.pcloudy-devices.outputs.device }}

          PCLOUDY_APPLICATION_NAME: firebase-ios-app.ipa

          IOS_BUNDLE_ID: org.reactjs.native.example.SwagLabsMobileApp

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Starting iOS Appium lifecycle test"
          echo "=========================================="

          echo "Device : $PCLOUDY_DEVICE"
          echo "Bundle : $IOS_BUNDLE_ID"
          echo "App    : $PCLOUDY_APPLICATION_NAME"

          if [ -z "$PCLOUDY_DEVICE" ]; then
            echo "ERROR: No available pCloudy device selected"
            exit 1
          fi

          pytest \
            automation/test_ios_lifecycle.py \
            -v \
            --tb=short \
            --junitxml=ios-appium-results.xml

          echo ""
          echo "=========================================="
          echo "iOS Appium test completed successfully"
          echo "=========================================="


      # ==================================================
      # 13. Upload Results
      # ==================================================

      - name: Upload iOS Appium results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-appium-test-results
          path: |
            ios-appium-results.xml
            firebase-release.json
            pcloudy-auth.json
            pcloudy-devices.json
            pcloudy-upload.json
          if-no-files-found: warn
