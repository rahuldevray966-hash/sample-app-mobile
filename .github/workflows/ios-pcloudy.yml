name: iOS Firebase → pCloudy Appium

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-pcloudy-test:
    name: iOS pCloudy Appium Test
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. YOUR EXISTING IOS / FIREBASE BUILD STEPS
      # ============================================================
      #
      # IMPORTANT:
      # Keep your existing steps here that generate/download:
      #
      #     firebase-ios-app.ipa
      #
      # DO NOT use npm ci unless package-lock.json exists.
      #
      # Example:
      #
      # - name: Build iOS
      #   ...
      #
      # - name: Upload/Download Firebase IPA
      #   ...
      #
      # Your existing Firebase process must create:
      #
      # firebase-ios-app.ipa
      #
      # ============================================================


      # ============================================================
      # 3. Check IPA exists
      # ============================================================
      - name: Check Firebase IPA
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking Firebase IPA"
          echo "=========================================="

          if [ ! -f "firebase-ios-app.ipa" ]; then
            echo "ERROR: firebase-ios-app.ipa not found"
            echo ""
            echo "Files in workspace:"
            find . -maxdepth 2 -type f | sort | head -100
            exit 1
          fi

          echo "IPA found:"
          ls -lh firebase-ios-app.ipa


      # ============================================================
      # 4. Validate IPA
      # ============================================================
      - name: Validate iOS IPA
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Validating Firebase IPA"
          echo "=========================================="

          rm -rf ipa_check

          unzip -q firebase-ios-app.ipa -d ipa_check

          APP=$(find ipa_check/Payload \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app found inside IPA"
            exit 1
          fi

          echo "App:"
          echo "$APP"


          # ----------------------------------------------------------
          # Bundle ID
          # ----------------------------------------------------------
          echo ""
          echo "=========================================="
          echo "Bundle ID"
          echo "=========================================="

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print:CFBundleIdentifier" \
              "$APP/Info.plist"
          )

          echo "Bundle ID: $BUNDLE_ID"

          EXPECTED_BUNDLE_ID="org.reactjs.native.example.SwagLabsMobileApp"

          if [ "$BUNDLE_ID" != "$EXPECTED_BUNDLE_ID" ]; then
            echo ""
            echo "ERROR: Bundle ID mismatch"
            echo "Expected: $EXPECTED_BUNDLE_ID"
            echo "Actual:   $BUNDLE_ID"
            exit 1
          fi

          echo "Bundle ID validation PASSED"


          # ----------------------------------------------------------
          # App version
          # ----------------------------------------------------------
          echo ""
          echo "=========================================="
          echo "App Version"
          echo "=========================================="

          APP_VERSION=$(
            /usr/libexec/PlistBuddy \
              -c "Print:CFBundleShortVersionString" \
              "$APP/Info.plist"
          )

          BUILD_NUMBER=$(
            /usr/libexec/PlistBuddy \
              -c "Print:CFBundleVersion" \
              "$APP/Info.plist"
          )

          echo "Version: $APP_VERSION"
          echo "Build:   $BUILD_NUMBER"


          # ----------------------------------------------------------
          # Minimum iOS
          # ----------------------------------------------------------
          echo ""
          echo "=========================================="
          echo "Minimum iOS Version"
          echo "=========================================="

          MIN_IOS=$(
            /usr/libexec/PlistBuddy \
              -c "Print:MinimumOSVersion" \
              "$APP/Info.plist" \
              2>/dev/null || echo "Not specified"
          )

          echo "Minimum iOS: $MIN_IOS"


          # ----------------------------------------------------------
          # Executable
          # ----------------------------------------------------------
          echo ""
          echo "=========================================="
          echo "Executable"
          echo "=========================================="

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print:CFBundleExecutable" \
              "$APP/Info.plist"
          )

          echo "Executable: $EXECUTABLE"


          # ----------------------------------------------------------
          # Architecture
          # ----------------------------------------------------------
          echo ""
          echo "=========================================="
          echo "Architecture"
          echo "=========================================="

          lipo -info "$APP/$EXECUTABLE"


          # ----------------------------------------------------------
          # Code signing information
          # ----------------------------------------------------------
          echo ""
          echo "=========================================="
          echo "Code Signing"
          echo "=========================================="

          codesign \
            -dv \
            --verbose=4 \
            "$APP" \
            2>&1 || true


          # ----------------------------------------------------------
          # Signature verification
          # ----------------------------------------------------------
          echo ""
          echo "=========================================="
          echo "Signature Verification"
          echo "=========================================="

          if codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"
          then
            echo "Code signing verification PASSED"
          else
            echo ""
            echo "WARNING: Code signing verification failed"
            echo "pCloudy may reject this IPA during installation."
            exit 1
          fi


          echo ""
          echo "=========================================="
          echo "IPA validation completed successfully"
          echo "=========================================="


      # ============================================================
      # 5. Install Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 6. Install Appium dependencies
      # ============================================================
      - name: Install Appium test dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            pytest \
            appium-python-client \
            selenium


      # ============================================================
      # 7. Find available iPhone 17 on pCloudy
      # ============================================================
      #
      # This step should use YOUR EXISTING pCloudy device API call.
      #
      # It searches for:
      #
      # Apple_iPhone17_Ios_26.5.1_8332e
      #
      # and writes the result into GITHUB_ENV.
      #
      # ============================================================
      - name: Find available iPhone 17
        env:
          PCLOUDY_USERNAME: ${{ secrets.PCLOUDY_USERNAME }}
          PCLOUDY_API_KEY: ${{ secrets.PCLOUDY_API_KEY }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Searching pCloudy devices"
          echo "=========================================="

          # ----------------------------------------------------------
          # IMPORTANT:
          # Keep your existing working pCloudy device API request here.
          #
          # The response previously showed:
          #
          # Apple_iPhone17_Ios_26.5.1_8332e
          #
          # ----------------------------------------------------------

          RESPONSE=$(curl -sS \
            -u "$PCLOUDY_USERNAME:$PCLOUDY_API_KEY" \
            "YOUR_EXISTING_PCLOUDY_DEVICE_API_ENDPOINT")

          echo "pCloudy device response:"
          echo "$RESPONSE"


          # ----------------------------------------------------------
          # Find exact iPhone 17
          # ----------------------------------------------------------
          DEVICE=$(echo "$RESPONSE" | python -c '
          import sys
          import json

          data = json.load(sys.stdin)

          models = data.get("models", [])

          for device in models:
              full_name = device.get("full_name", "")
              available = device.get("available", False)

              if (
                  full_name == "Apple_iPhone17_Ios_26.5.1_8332e"
                  and available
              ):
                  print(full_name)
                  sys.exit(0)

          print("ERROR: Requested iPhone 17 is not available", file=sys.stderr)
          sys.exit(1)
          ')

          if [ -z "$DEVICE" ]; then
            echo "ERROR: iPhone 17 was not found"
            exit 1
          fi

          echo "Selected device:"
          echo "$DEVICE"

          echo "PCLOUDY_DEVICE=$DEVICE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. Upload IPA to pCloudy
      # ============================================================
      - name: Upload Firebase IPA to pCloudy
        env:
          PCLOUDY_USERNAME: ${{ secrets.PCLOUDY_USERNAME }}
          PCLOUDY_API_KEY: ${{ secrets.PCLOUDY_API_KEY }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Uploading Firebase IPA to pCloudy"
          echo "=========================================="

          if [ ! -f "firebase-ios-app.ipa" ]; then
            echo "ERROR: IPA not found"
            exit 1
          fi

          ls -lh firebase-ios-app.ipa


          # ----------------------------------------------------------
          # IMPORTANT:
          # Replace this with YOUR CURRENT WORKING pCloudy
          # upload endpoint.
          #
          # Your existing upload already returns HTTP 200,
          # so don't change the endpoint unnecessarily.
          # ----------------------------------------------------------

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -u "$PCLOUDY_USERNAME:$PCLOUDY_API_KEY" \
            -X POST \
            -F "file=@firebase-ios-app.ipa" \
            "YOUR_EXISTING_PCLOUDY_UPLOAD_ENDPOINT")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "pCloudy upload HTTP status: $HTTP_STATUS"
          echo ""
          echo "pCloudy response:"
          echo "$BODY"


          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: pCloudy upload failed"
            exit 1
          fi

          echo ""
          echo "IPA uploaded to pCloudy successfully"


      # ============================================================
      # 9. Run Appium lifecycle test
      # ============================================================
      - name: Run iOS Appium lifecycle test
        env:
          PCLOUDY_USERNAME: ${{ secrets.PCLOUDY_USERNAME }}
          PCLOUDY_API_KEY: ${{ secrets.PCLOUDY_API_KEY }}
          PCLOUDY_DEVICE: ${{ env.PCLOUDY_DEVICE }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Starting iOS Appium lifecycle test"
          echo "=========================================="

          echo "Device : $PCLOUDY_DEVICE"
          echo "Bundle : org.reactjs.native.example.SwagLabsMobileApp"
          echo "App    : firebase-ios-app.ipa"

          echo "=========================================="

          pytest \
            automation/test_ios_lifecycle.py \
            -v \
            --junitxml=ios-appium-results.xml


      # ============================================================
      # 10. Upload test results
      # ============================================================
      - name: Upload iOS Appium test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-appium-results
          path: |
            ios-appium-results.xml
            ipa_check/


      # ============================================================
      # 11. Cleanup pCloudy session / uploaded app
      # ============================================================
      #
      # If your existing workflow has a pCloudy cleanup API,
      # keep it here.
      #
      # ============================================================
      - name: Cleanup
        if: always()
        run: |
          echo "=========================================="
          echo "iOS pCloudy workflow completed"
          echo "=========================================="
