name: iOS Appium - Firebase - pCloudy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios-appium:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Setup Python
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ==================================================
      # 3. Install Python dependencies
      # ==================================================

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install Appium-Python-Client selenium pytest pytest-html
          fi

          echo "=========================================="
          echo "Installed packages"
          echo "=========================================="

          pip list


      # ==================================================
      # 4. Firebase authentication
      # ==================================================

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}


      # ==================================================
      # 5. Get Firebase access token
      # ==================================================

      - name: Get Firebase access token
        id: firebase-token
        shell: bash
        run: |
          set -euo pipefail

          echo "Getting Firebase access token..."

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Firebase authentication successful"


      # ==================================================
      # 6. Get latest Firebase iOS release
      # ==================================================

      - name: Get latest Firebase iOS release
        id: firebase-release
        shell: bash

        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Getting latest Firebase iOS release"
          echo "=========================================="

          PROJECT_NUMBER="$(printf '%s' "$FIREBASE_PROJECT_NUMBER" | tr -d '[:space:]')"
          APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is not numeric"
            exit 1
          fi

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"

          printf '%s\n' "$RESPONSE" > firebase-release.json

          DOWNLOAD_URL="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"

          RELEASE_NAME="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: No Firebase iOS release found"
            cat firebase-release.json
            exit 1
          fi

          echo "Latest Firebase release:"
          echo "$RELEASE_NAME"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 7. Download existing IPA from Firebase
      # ==================================================

      - name: Download latest Firebase IPA
        shell: bash

        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Downloading existing Firebase IPA"
          echo "=========================================="

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Download URL is empty"
            exit 1
          fi

          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            "$DOWNLOAD_URL" \
            --output firebase-ios-app.ipa

          if [ ! -s firebase-ios-app.ipa ]; then
            echo "ERROR: IPA download failed"
            exit 1
          fi

          echo "Firebase IPA downloaded successfully"

          ls -lh firebase-ios-app.ipa


      # ==================================================
      # 8. Verify IPA
      # ==================================================

      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verifying IPA"
          echo "=========================================="

          file firebase-ios-app.ipa

          if ! unzip -t firebase-ios-app.ipa >/dev/null 2>&1; then
            echo "ERROR: Downloaded file is not a valid IPA/ZIP"
            exit 1
          fi

          echo "IPA archive is valid"

          echo ""
          echo "IPA contents:"
          unzip -l firebase-ios-app.ipa | head -30


      # ==================================================
      # 9. Authenticate with pCloudy
      # ==================================================

      - name: Authenticate with pCloudy
        id: pcloudy-auth
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Authenticating with pCloudy"
          echo "=========================================="

          if [ -z "$PCLOUDY_EMAIL" ]; then
            echo "ERROR: PCLOUDY_EMAIL is empty"
            exit 1
          fi

          if [ -z "$PCLOUDY_ACCESS_KEY" ]; then
            echo "ERROR: PCLOUDY_ACCESS_KEY is empty"
            exit 1
          fi

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-auth.json

          TOKEN="$(
            printf '%s' "$RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not extract pCloudy token"
            cat pcloudy-auth.json
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

          echo "pCloudy authentication successful"


      # ==================================================
      # 10. Get pCloudy device list
      # ==================================================

      - name: Get pCloudy device list
        id: devices
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Getting pCloudy device list"
          echo "=========================================="

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -H "Authorization: Bearer ${PCLOUDY_TOKEN}" \
              -H "Accept: application/json" \
              "https://device.pcloudy.com/api/devices"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-devices.json

          echo ""
          echo "pCloudy device API response received"

          echo ""
          echo "=========================================="
          echo "Available / Listed Devices"
          echo "=========================================="

          # Print useful fields when returned by API
          jq -r '
            .. |
            objects |
            select(
              (.deviceFullName? != null) or
              (.deviceName? != null) or
              (.name? != null)
            ) |
            [
              (.deviceId // .id // "-"),
              (.deviceFullName // .deviceName // .name // "-"),
              (.deviceVersion // .version // "-"),
              (.status // .availability // "-")
            ] |
            @tsv
          ' pcloudy-devices.json 2>/dev/null || true

          echo ""
          echo "Full device response saved as pcloudy-devices.json"


      # ==================================================
      # 11. Check requested iPhone availability
      # ==================================================

      - name: Check requested iPhone availability
        shell: bash

        env:
          PCLOUDY_DEVICE: Apple_iPhone17_Ios_26.5.1

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking requested iOS device"
          echo "=========================================="

          echo "Requested device:"
          echo "$PCLOUDY_DEVICE"

          echo ""

          if grep -Fq "$PCLOUDY_DEVICE" pcloudy-devices.json; then

            echo "Device exists in pCloudy device response."
            echo "However, pCloudy may still reject the device"
            echo "if it is currently occupied/offline."

          else

            echo "WARNING:"
            echo "Requested device was not found in the device response."

            echo ""
            echo "Available device response:"
            cat pcloudy-devices.json

            echo ""
            echo "The Appium session may fail because this"
            echo "DeviceFullName is not currently available."

            exit 1

          fi


      # ==================================================
      # 12. Upload existing Firebase IPA to pCloudy
      # ==================================================

      - name: Upload IPA to pCloudy
        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Uploading Firebase IPA to pCloudy"
          echo "=========================================="

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              -o pcloudy-upload.json \
              -w "%{http_code}" \
              -X POST \
              -F "file=@firebase-ios-app.ipa" \
              -F "source_type=raw" \
              -F "token=${PCLOUDY_TOKEN}" \
              -F "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"

          echo "pCloudy upload HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: pCloudy IPA upload failed"
            cat pcloudy-upload.json
            exit 1
          fi

          echo "IPA uploaded to pCloudy successfully"


      # ==================================================
      # 13. Run iOS Appium lifecycle test
      # ==================================================

      - name: Run iOS Appium lifecycle test on iPhone 17
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          PCLOUDY_DEVICE: Apple_iPhone17_Ios_26.5.1

          PCLOUDY_APPLICATION_NAME: firebase-ios-app.ipa

          IOS_BUNDLE_ID: org.reactjs.native.example.SwagLabsMobileApp

        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "Starting iOS Appium lifecycle test"
          echo "=========================================="

          echo "Device : $PCLOUDY_DEVICE"
          echo "Bundle : $IOS_BUNDLE_ID"
          echo "App    : $PCLOUDY_APPLICATION_NAME"

          echo "=========================================="
          echo ""

          pytest \
            automation/test_ios_lifecycle.py \
            -v \
            --tb=short \
            --junitxml=ios-appium-results.xml

          echo ""
          echo "=========================================="
          echo "iOS Appium lifecycle test completed"
          echo "=========================================="


      # ==================================================
      # 14. Upload results
      # ==================================================

      - name: Upload iOS Appium results
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: ios-appium-test-results-iphone17

          path: |
            ios-appium-results.xml
            firebase-release.json
            pcloudy-auth.json
            pcloudy-devices.json
            pcloudy-upload.json

          if-no-files-found: warn
