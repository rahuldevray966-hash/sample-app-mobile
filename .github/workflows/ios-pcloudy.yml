name: iOS Build → Firebase → pCloudy Appium

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-test:
    name: Build iOS → Upload pCloudy → Appium Test
    runs-on: macos-latest

    steps:

      # ==========================================
      # 1. Checkout source
      # ==========================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install npm dependencies
        run: |
          set -euo pipefail

          npm ci


      # ==========================================
      # 4. Setup Ruby / CocoaPods
      # ==========================================
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true


      # ==========================================
      # 5. Install CocoaPods
      # ==========================================
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          set -euo pipefail

          pod install


      # ==========================================
      # 6. Build iOS IPA
      # ==========================================
      #
      # IMPORTANT:
      # This must create a DEVICE IPA, not a simulator build.
      #
      # Update workspace/scheme according to your project.
      #
      - name: Build iOS IPA
        run: |
          set -euo pipefail

          mkdir -p build

          xcodebuild \
            -workspace ios/SwagLabsMobileApp.xcworkspace \
            -scheme SwagLabsMobileApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/SwagLabsMobileApp.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO

          echo "Archive created"


      # ==========================================
      # 7. Export IPA
      # ==========================================
      #
      # If your project already generates
      # firebase-ios-app.ipa, you can replace this
      # section with your existing Firebase artifact.
      #
      - name: Export iOS IPA
        run: |
          set -euo pipefail

          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/SwagLabsMobileApp.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist"

          cp build/export/*.ipa firebase-ios-app.ipa

          echo "IPA created:"
          ls -lh firebase-ios-app.ipa


      # ==========================================
      # 8. Validate IPA
      # ==========================================
      - name: Validate iOS IPA
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Validating Firebase IPA"
          echo "=========================================="

          if [ ! -f firebase-ios-app.ipa ]; then
            echo "ERROR: firebase-ios-app.ipa not found"
            exit 1
          fi

          ls -lh firebase-ios-app.ipa

          rm -rf ipa_check

          unzip -q firebase-ios-app.ipa -d ipa_check

          APP=$(find ipa_check/Payload \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app found inside IPA"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "Application"
          echo "=========================================="

          echo "App: $APP"

          echo ""
          echo "=========================================="
          echo "Bundle ID"
          echo "=========================================="

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print:CFBundleIdentifier" \
              "$APP/Info.plist"
          )

          echo "$BUNDLE_ID"

          EXPECTED_BUNDLE_ID="org.reactjs.native.example.SwagLabsMobileApp"

          if [ "$BUNDLE_ID" != "$EXPECTED_BUNDLE_ID" ]; then
            echo ""
            echo "ERROR: Bundle ID mismatch"
            echo "Expected: $EXPECTED_BUNDLE_ID"
            echo "Actual:   $BUNDLE_ID"
            exit 1
          fi

          echo ""
          echo "Bundle ID validation PASSED"


          echo ""
          echo "=========================================="
          echo "Minimum iOS Version"
          echo "=========================================="

          MIN_IOS=$(
            /usr/libexec/PlistBuddy \
              -c "Print:MinimumOSVersion" \
              "$APP/Info.plist"
          )

          echo "$MIN_IOS"


          echo ""
          echo "=========================================="
          echo "Executable"
          echo "=========================================="

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print:CFBundleExecutable" \
              "$APP/Info.plist"
          )

          echo "Executable: $EXECUTABLE"


          echo ""
          echo "=========================================="
          echo "Architecture"
          echo "=========================================="

          lipo -info "$APP/$EXECUTABLE"


          echo ""
          echo "=========================================="
          echo "Code Signing"
          echo "=========================================="

          codesign -dv \
            --verbose=4 \
            "$APP" \
            2>&1 || true


          echo ""
          echo "=========================================="
          echo "Signature Verification"
          echo "=========================================="

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"

          echo ""
          echo "=========================================="
          echo "IPA validation completed successfully"
          echo "=========================================="


      # ==========================================
      # 9. Upload IPA to pCloudy
      # ==========================================
      - name: Upload Firebase IPA to pCloudy
        env:
          PCLOUDY_USERNAME: ${{ secrets.PCLOUDY_USERNAME }}
          PCLOUDY_API_KEY: ${{ secrets.PCLOUDY_API_KEY }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Uploading Firebase IPA to pCloudy"
          echo "=========================================="

          if [ ! -f firebase-ios-app.ipa ]; then
            echo "ERROR: IPA not found"
            exit 1
          fi

          # --------------------------------------
          # Replace this URL with your existing
          # pCloudy upload endpoint
          # --------------------------------------

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -u "$PCLOUDY_USERNAME:$PCLOUDY_API_KEY" \
            -X POST \
            -F "file=@firebase-ios-app.ipa" \
            "YOUR_PCLOUDY_UPLOAD_ENDPOINT")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "pCloudy upload HTTP status: $HTTP_STATUS"

          echo "$BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: pCloudy upload failed"
            exit 1
          fi

          echo "IPA uploaded to pCloudy successfully"


      # ==========================================
      # 10. Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # ==========================================
      # 11. Install Appium test dependencies
      # ==========================================
      - name: Install Python dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            pytest \
            appium-python-client \
            selenium


      # ==========================================
      # 12. Run iOS Appium lifecycle test
      # ==========================================
      - name: Run iOS Appium lifecycle test
        env:
          PCLOUDY_USERNAME: ${{ secrets.PCLOUDY_USERNAME }}
          PCLOUDY_API_KEY: ${{ secrets.PCLOUDY_API_KEY }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Starting iOS Appium lifecycle test"
          echo "=========================================="

          echo "Device : Apple_iPhone17_Ios_26.5.1_8332e"
          echo "Bundle : org.reactjs.native.example.SwagLabsMobileApp"
          echo "App    : firebase-ios-app.ipa"

          echo "=========================================="

          pytest \
            automation/test_ios_lifecycle.py \
            -v \
            --junitxml=ios-appium-results.xml


      # ==========================================
      # 13. Upload test result
      # ==========================================
      - name: Upload iOS Appium test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-appium-results
          path: |
            ios-appium-results.xml
            ipa_check/
