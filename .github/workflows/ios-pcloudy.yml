name: Task 5 - Firebase iOS IPA to pCloudy Appium

on:

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  ios-appium-pcloudy:

    name: Firebase IPA -> pCloudy -> iPhone 13

    runs-on: ubuntu-latest


    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. Authenticate with Firebase
      # ============================================================

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2

        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # ============================================================
      # 3. Get Firebase access token
      # ============================================================

      - name: Get Firebase access token
        id: firebase-token
        shell: bash

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Getting Firebase access token"
          echo "=========================================="

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [[ -z "$ACCESS_TOKEN" ]]; then
            echo "ERROR: Could not get Firebase access token"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Firebase authentication successful"


      # ============================================================
      # 4. Get latest Firebase iOS release
      # ============================================================

      - name: Get latest Firebase iOS release
        id: firebase-release
        shell: bash

        env:

          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}

          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Getting latest Firebase iOS release"
          echo "=========================================="


          # Remove accidental spaces/newlines

          PROJECT_NUMBER="$(
            printf '%s' "$FIREBASE_PROJECT_NUMBER" |
            tr -d '[:space:]'
          )"

          APP_ID="$(
            printf '%s' "$FIREBASE_APP_ID" |
            tr -d '[:space:]'
          )"


          # Validate

          if [[ -z "$PROJECT_NUMBER" ]]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if [[ -z "$APP_ID" ]]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          if [[ -z "$ACCESS_TOKEN" ]]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi


          # Project number validation

          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is not numeric"
            exit 1
          fi


          # Firebase iOS App ID validation

          if ! [[ "$APP_ID" =~ ^[0-9]+:[0-9]+:ios:[A-Za-z0-9]+$ ]]; then

            echo "ERROR: FIREBASE_APP_ID format looks incorrect"

            echo "Expected format:"
            echo "1:PROJECT_NUMBER:ios:APP_IDENTIFIER"

            exit 1

          fi


          echo "Firebase project number is configured"

          echo "Firebase iOS App ID is configured"


          # Firebase API endpoint

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"


          echo "Calling Firebase App Distribution API..."


          # IMPORTANT:
          # --get + --data-urlencode avoids malformed URL problems

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"


          # Save response

          echo "$RESPONSE" > firebase-release.json


          echo "Firebase API request successful"


          # Get download URL

          DOWNLOAD_URL="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"


          # Get release name

          RELEASE_NAME="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"


          if [[ -z "$DOWNLOAD_URL" ]]; then

            echo "ERROR: No Firebase iOS release found"

            echo ""

            echo "Firebase API response:"

            cat firebase-release.json

            exit 1

          fi


          echo "Latest Firebase release:"
          echo "$RELEASE_NAME"


          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


          echo "Firebase iOS release found successfully"


      # ============================================================
      # 5. Download existing IPA from Firebase
      # ============================================================

      - name: Download latest iOS IPA
        shell: bash

        env:

          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Downloading latest iOS IPA"
          echo "=========================================="


          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "ERROR: Firebase download URL is empty"
            exit 1
          fi


          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --output firebase-ios-app.ipa \
            "$DOWNLOAD_URL"


          if [[ ! -s firebase-ios-app.ipa ]]; then
            echo "ERROR: IPA download failed"
            exit 1
          fi


          echo "Firebase IPA downloaded successfully"

          ls -lh firebase-ios-app.ipa


      # ============================================================
      # 6. Verify IPA
      # ============================================================

      - name: Verify IPA
        shell: bash

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Verifying IPA"
          echo "=========================================="


          file firebase-ios-app.ipa


          IPA_SIZE="$(stat -c%s firebase-ios-app.ipa)"


          if [[ "$IPA_SIZE" -le 0 ]]; then
            echo "ERROR: IPA is empty"
            exit 1
          fi


          echo "IPA size: ${IPA_SIZE} bytes"


          echo "Testing IPA archive..."

          unzip -t firebase-ios-app.ipa >/dev/null


          echo "IPA verification successful"


      # ============================================================
      # 7. Authenticate with pCloudy
      # ============================================================

      - name: Authenticate with pCloudy
        id: pcloudy-auth
        shell: bash

        env:

          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}

          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Authenticating with pCloudy"
          echo "=========================================="


          if [[ -z "$PCLOUDY_EMAIL" ]]; then
            echo "ERROR: PCLOUDY_EMAIL is empty"
            exit 1
          fi


          if [[ -z "$PCLOUDY_ACCESS_KEY" ]]; then
            echo "ERROR: PCLOUDY_ACCESS_KEY is empty"
            exit 1
          fi


          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"


          TOKEN="$(
            printf '%s' "$RESPONSE" |
            jq -r '.result.token // .[0].token // empty'
          )"


          if [[ -z "$TOKEN" ]]; then

            echo "ERROR: Could not extract pCloudy token"

            exit 1

          fi


          echo "::add-mask::$TOKEN"


          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"


          echo "pCloudy authentication successful"


      # ============================================================
      # 8. Upload IPA to pCloudy
      # ============================================================

      - name: Upload IPA to pCloudy
        shell: bash

        env:

          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Uploading IPA to pCloudy"
          echo "=========================================="


          if [[ -z "$PCLOUDY_TOKEN" ]]; then
            echo "ERROR: pCloudy token is empty"
            exit 1
          fi


          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output pcloudy-upload.json \
              --write-out "%{http_code}" \
              --request POST \
              --form "file=@firebase-ios-app.ipa" \
              --form "source_type=raw" \
              --form "token=${PCLOUDY_TOKEN}" \
              --form "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"


          echo "pCloudy upload HTTP status: ${HTTP_CODE}"


          if [[ "$HTTP_CODE" != "200" ]]; then

            echo "ERROR: pCloudy IPA upload failed"

            cat pcloudy-upload.json

            exit 1

          fi


          echo "IPA uploaded to pCloudy successfully"


      # ============================================================
      # 9. Setup Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ============================================================
      # 10. Install Appium dependencies
      # ============================================================

      - name: Install Appium dependencies
        shell: bash

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Installing Python dependencies"
          echo "=========================================="


          python -m pip install --upgrade pip


          if [[ ! -f requirements.txt ]]; then

            echo "ERROR: requirements.txt not found"

            exit 1

          fi


          pip install -r requirements.txt


          echo "Appium dependencies installed successfully"


      # ============================================================
      # 11. Run iOS Appium lifecycle test
      # ============================================================

      - name: Run iOS Appium lifecycle test
        shell: bash

        env:

          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}

          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          # ========================================================
          # HARD-CODED iPHONE 13
          # ========================================================

          PCLOUDY_DEVICE: Apple_iPhone13_Ios_17.2.1

          PCLOUDY_APPLICATION_NAME: firebase-ios-app.ipa

          IOS_BUNDLE_ID: org.reactjs.native.example.SwagLabsMobileApp

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Starting iOS Appium lifecycle test"
          echo "=========================================="


          echo "Device : $PCLOUDY_DEVICE"

          echo "Bundle : $IOS_BUNDLE_ID"

          echo "App    : $PCLOUDY_APPLICATION_NAME"


          echo "=========================================="


          pytest \
            automation/test_ios_lifecycle.py \
            -v \
            --tb=short \
            --junitxml=ios-appium-results.xml


          echo "=========================================="

          echo "iOS Appium lifecycle test completed"

          echo "=========================================="


      # ============================================================
      # 12. Upload test results
      # ============================================================

      - name: Upload iOS test results
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: ios-appium-test-results-iphone13

          path: |
            ios-appium-results.xml
            firebase-release.json
            pcloudy-upload.json

          if-no-files-found: warn
