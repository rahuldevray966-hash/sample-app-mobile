name: iOS Appium - Firebase - pCloudy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios-appium:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------
      # 1. Checkout
      # ------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # 2. Python
      # ------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------
      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install Appium-Python-Client selenium pytest pytest-html
          fi

          echo "Installed packages:"
          pip list

      # ------------------------------------------
      # 4. Firebase authentication
      # ------------------------------------------
      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # ------------------------------------------
      # 5. Get Google access token
      # ------------------------------------------
      - name: Get Firebase access token
        id: firebase-token
        shell: bash
        run: |
          set -euo pipefail

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      # ------------------------------------------
      # 6. Get latest Firebase iOS release
      # ------------------------------------------
      - name: Get latest Firebase iOS release
        id: firebase-release
        shell: bash
        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Getting latest Firebase iOS release"
          echo "=========================================="

          PROJECT_NUMBER="$(printf '%s' "$FIREBASE_PROJECT_NUMBER" | tr -d '[:space:]')"
          APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is not numeric"
            exit 1
          fi

          if ! [[ "$APP_ID" =~ ^[0-9]+:[0-9]+:ios:[A-Za-z0-9]+$ ]]; then
            echo "ERROR: FIREBASE_APP_ID format looks incorrect"
            exit 1
          fi

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          echo "Firebase project number is configured"
          echo "Firebase iOS App ID is configured"
          echo "Calling Firebase App Distribution API..."

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"

          printf '%s\n' "$RESPONSE" > firebase-release.json

          DOWNLOAD_URL="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"

          RELEASE_NAME="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: No Firebase iOS release found"
            cat firebase-release.json
            exit 1
          fi

          echo "Latest release:"
          echo "$RELEASE_NAME"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

      # ------------------------------------------
      # 7. Download latest IPA
      # ------------------------------------------
      - name: Download latest Firebase IPA
        shell: bash
        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Downloading latest Firebase IPA"
          echo "=========================================="

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Download URL is empty"
            exit 1
          fi

          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            "$DOWNLOAD_URL" \
            --output firebase-ios-app.ipa

          if [ ! -s firebase-ios-app.ipa ]; then
            echo "ERROR: IPA download failed"
            exit 1
          fi

          echo "IPA downloaded successfully"
          ls -lh firebase-ios-app.ipa

      # ------------------------------------------
      # 8. Verify IPA
      # ------------------------------------------
      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail

          file firebase-ios-app.ipa

          if ! file firebase-ios-app.ipa | grep -qi zip; then
            echo "WARNING: IPA does not look like a ZIP archive"
          fi

          unzip -l firebase-ios-app.ipa | head -30

      # ------------------------------------------
      # 9. Run iOS Appium lifecycle test
      # ------------------------------------------
      - name: Run iOS Appium lifecycle test
        shell: bash
        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          # iPhone 17
          PCLOUDY_DEVICE: Apple_iPhone17_Ios_26.5.1

          PCLOUDY_APPLICATION_NAME: firebase-ios-app.ipa

          IOS_BUNDLE_ID: org.reactjs.native.example.SwagLabsMobileApp

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Starting iOS Appium lifecycle test"
          echo "=========================================="

          echo "Device : $PCLOUDY_DEVICE"
          echo "Bundle : $IOS_BUNDLE_ID"
          echo "App    : $PCLOUDY_APPLICATION_NAME"

          if [ -z "$PCLOUDY_EMAIL" ]; then
            echo "ERROR: PCLOUDY_EMAIL is empty"
            exit 1
          fi

          if [ -z "$PCLOUDY_ACCESS_KEY" ]; then
            echo "ERROR: PCLOUDY_ACCESS_KEY is empty"
            exit 1
          fi

          pytest \
            automation/test_ios_lifecycle.py \
            -v \
            --tb=short \
            --junitxml=ios-appium-results.xml

      # ------------------------------------------
      # 10. Upload test results
      # ------------------------------------------
      - name: Upload iOS Appium results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-appium-test-results-iphone17
          path: |
            ios-appium-results.xml
            firebase-release.json
          if-no-files-found: warn
